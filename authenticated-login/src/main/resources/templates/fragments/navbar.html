
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

    <header th:fragment="navbar" class="app-header">
        <nav class="navbar navbar-expand container app-navbar"
             aria-label="Navegación principal">

            <a class="navbar-brand app-brand" th:href="@{/app/users}">
                <span class="brand-icon" aria-hidden="true">A</span>
                <span>Admin</span>
            </a>

            <div class="dropdown">
                <button
                    class="btn menu-button dropdown-toggle"
                    type="button"
                    id="mainMenu"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Menú
                </button>

                <ul class="dropdown-menu dropdown-menu-end app-dropdown"
                    aria-labelledby="mainMenu">

                    <li>
                        <a class="dropdown-item"
                           th:href="@{/}">
                            Inicio
                        </a>
                    </li>

                    <li>
                        <a class="dropdown-item"
                           th:href="@{/app/users}">
                            Usuarios
                        </a>
                    </li>

                </ul>
            </div>

        </nav>
    </header>

</body>
</html>
